[project]
name = "txtav-parts"
version = "0.1.0"
description = "Parts availability workflow for the Textron Aviation customer portal"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "lxml>=5.3",
    "playwright>=1.63",
]

# openpyxl is a test-only dependency. The part list is read by txtav.xlsx_reader
# instead, because openpyxl coerces the 2,930 numerically stored part numbers in
# the client's sheet into floats and dates. See that module's docstring.
[project.optional-dependencies]
dev = ["pytest>=8.3", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["txtav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
